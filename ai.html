    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --bg-base: #0a0a0f;
            --bg-surface: #0d0d14;
            --bg-soft: #14141f;
            --bg-elevated: #1c1c2a;
            --text-primary: #e4e4e7;
            --text-secondary: #c084fc;
            --text-muted: #a855f7;
            --accent: #d946ef;
            --accent-secondary: #c026d3;
            --accent-gradient: linear-gradient(135deg, #d946ef, #ec4899, #a21caf);
            --accent-soft: #2d0d3a;
            --border: #4a1d6d;
            --border-soft: #2d1b3d;
            --card-bg: #0f0f18;
            --code-bg: #0a0a10;
            --success: #4ade80;
            --warning: #fbbf24;
            --error: #f87171;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 8px rgba(168, 85, 247, 0.2);
            --shadow-lg: 0 10px 20px rgba(217, 70, 239, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.7;
            color: var(--text-primary);
            background: linear-gradient(135deg, #0a0a0f 0%, #0d0d14 50%, #14141f 100%);
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem;
            width: 100%;
        }

        .site-header {
            padding: 1.25rem 0;
            background: rgba(13, 13, 20, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .site-title {
            font-size: 1.35rem;
            font-weight: 650;
            background: linear-gradient(135deg, #d946ef, #ec4899, #a21caf);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
        }

        .nav {
            display: flex;
            gap: 2rem;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav a:hover {
            color: #ec4899;
        }

        .ai-chat-section {
            margin: 2rem 0;
        }

        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--accent-gradient);
            color: white;
            padding: 1rem;
            text-align: center;
            font-weight: 600;
        }

        .status {
            font-size: 0.875rem;
            margin-top: 0.5rem;
            opacity: 0.9;
        }

        .context-buttons {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .context-buttons button {
            padding: 0.5rem 1rem;
            background-color: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .context-buttons button:hover {
            background-color: var(--accent);
            color: white;
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
            background-color: var(--bg-base);
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .message.user {
            background: var(--accent-gradient);
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .message.bot {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .typing {
            font-style: italic;
            color: var(--text-muted);
        }

        .chat-input {
            display: flex;
            padding: 1rem;
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border);
        }

        .chat-input input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 40px;
            outline: none;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: inherit;
        }

        .chat-input input::placeholder {
            color: var(--text-muted);
        }

        .chat-input button {
            margin-left: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .chat-input button:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .site-footer {
            margin-top: 4rem;
            padding: 2rem 0;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-muted);
        }

        ::selection {
            background: #d946ef;
            color: white;
        }
    </style>
</head>
